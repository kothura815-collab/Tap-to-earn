<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap to Earn</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCE_t8CjxmuKW0qfscdeklpks9se2AnOtU",
            authDomain: "tap-to-earn-eaaf2.firebaseapp.com",
            projectId: "tap-to-earn-eaaf2",
            storageBucket: "tap-to-earn-eaaf2.firebasestorage.app",
            messagingSenderId: "597392618200",
            appId: "1:597392618200:web:2316fb26b28604d2ccddad",
            measurementId: "G1WZLN21MXD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
    </script>

    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
        };
    </script>
</head>
<body>

    <!-- Adsterra Smart Links (Hidden) -->
    <div style="display:none;">
        <script data-cfasync="false" src="https://abscloud.org/1/6d1b42cc7ed3b78f3794b14f1475296b"></script>
        <script data-cfasync="false" src="https://bauval.org/14/985fbe3f48c3058f30113847af7bb387"></script>
    </div>

    <!-- User Info -->
    <div id="userInfo" class="user-info">
        <div class="user-badge">
            <span class="user-icon">👤</span>
            <span id="userName">User</span>
        </div>
        <div class="balance-badge">
            <span class="balance-icon">💰</span>
            <span id="userBalance">$0.00000</span>
        </div>
    </div>

    <!-- Main Tap Area -->
    <div class="container" id="mainContainer">
        <div class="header-text">
            <h1>TAP TO EARN</h1>
            <p class="subtitle">YOUR BONUS!</p>
        </div>
        
        <div class="timer-box">
            <span class="timer-label">TIME LEFT</span>
            <span id="secondsLeft" class="timer-value">10</span>
            <span class="timer-label">SEC</span>
        </div>

        <div class="coin-container">
            <div class="coin-glow"></div>
            <div class="coin" id="coinBtn">
                <span class="dollar-sign">$</span>
                <div class="hand-icon">👆</div>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">TIME LEFT: 10</div>
        </div>

        <div class="tap-counter">
            <span id="tapCountDisplay">0</span> / 10 TAPS
        </div>
    </div>

    <!-- Processing Screen -->
    <div id="processingScreen" class="screen-container hidden">
        <div class="screen-content">
            <div class="processing-icon">⚙️</div>
            <h2>PROCESSING...</h2>
            <p>Please wait <span id="processingTimer">10</span> seconds</p>
            <div class="loader"></div>
        </div>
    </div>

    <!-- First Claim Screen -->
    <div id="firstClaimScreen" class="screen-container hidden">
        <div class="screen-content">
            <div class="success-icon">🎉</div>
            <h2>STEP 1 COMPLETE</h2>
            <p>You earned <span id="firstRewardAmount" class="reward-text">$0.00</span></p>
            <p class="unlock-text">WATCH AD TO CONTINUE</p>
            <button class="action-btn" id="firstClaimBtn">WATCH AD & CONTINUE</button>
        </div>
    </div>

    <!-- Final Claim Screen -->
    <div id="finalClaimScreen" class="screen-container hidden">
        <div class="screen-content">
            <div class="success-icon">🏆</div>
            <h2>FINAL STEP</h2>
            <p>You earned <span id="finalRewardAmount" class="reward-text">$0.00</span></p>
            <p class="unlock-text">WATCH AD TO CLAIM REWARD</p>
            <button class="action-btn" id="finalClaimBtn">WATCH AD & CLAIM</button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <h3>📜 Withdraw History</h3>
            <ul id="historyList"><li>Loading...</li></ul>
            <button class="close-btn" onclick="closeHistory()">Close</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn" onclick="showHistory()">
            <span class="nav-icon">📜</span>
            <span>History</span>
        </button>
        <button class="nav-btn" onclick="withdraw()">
            <span class="nav-icon">💸</span>
            <span>Withdraw</span>
        </button>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
