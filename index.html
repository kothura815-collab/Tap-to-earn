<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tap to Earn</title>
    <link rel="stylesheet" href="style.css">
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- AdsGram SDK (ဥပမာ - သင့် Network အလိုက် ပြောင်းပါ) -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>

    <!-- Telegram User Info (Hidden) -->
    <div id="userInfo" class="user-info">
        <span id="userName">User</span>
        <span id="userBalance">$0.00</span>
    </div>

    <!-- Main Tap Area -->
    <div class="container" id="mainContainer">
        <h1>TAP TO EARN<br>YOUR BONUS!</h1>
        <div class="timer-text">YOU HAVE <span id="secondsLeft">10</span> SECONDS</div>

        <div class="coin-container">
            <div class="coin" id="coinBtn">
                <span>$</span>
                <div class="hand-icon">👆</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">TIME LEFT: 10</div>
        </div>
    </div>

    <!-- Success Screen (Ads ကြည့်ပြီးမှ ပေါ်လာမယ်) -->
    <div id="successScreen" class="success-screen hidden">
        <h2>CONGRATULATIONS</h2>
        <p>You earned <span id="rewardAmount">$0.01</span></p>
        <p class="unlock-text">WATCH AD TO CLAIM REWARD</p>
        <button class="continue-btn" id="watchAdBtn">WATCH AD & CLAIM</button>
    </div>

    <!-- Withdraw History Modal -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <h3>Withdraw History</h3>
            <ul id="historyList">
                <!-- History data will be loaded here from Database -->
                <li>No history yet.</li>
            </ul>
            <button onclick="closeHistory()">Close</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button onclick="showHistory()">📜 History</button>
        <button onclick="withdraw()">💸 Withdraw</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
